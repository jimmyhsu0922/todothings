name: todothings
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  scrollable_positioned_list: ^0.3.8
  timezone: ^0.9.2

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  firebase_auth: ^6.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 💡 以下是正確且唯一的 flutter 配置區塊
flutter:
  uses-material-design: true


  # 🎯 這裡縮排剛好 2 個空格
  assets:
    # 🎯 這裡連字號「-」前面剛好 4 個空格
    - assets/images/faith_bg.JPG